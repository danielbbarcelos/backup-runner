[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backup-runner"
version = "0.2.0"
description = "Backup agendado de bancos MySQL e diretórios, com destinos local, S3 e SFTP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel" }]
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "cryptography>=41.0",
    "boto3>=1.34",
    "paramiko>=2.12",
]

[project.scripts]
backup-runner = "backup_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backup_runner"]
